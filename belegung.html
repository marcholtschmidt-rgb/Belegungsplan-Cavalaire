<!DOCTYPE html>
<html lang="de">

<title>Belegungsplan Cavalaire</title>

<link rel="apple-touch-icon" href="icon-192-v2.png" />

<style>
:root{--bg:#F5EFE3;--ink:#123A4E;--card:#FFFDF9;--line:#E7DFCF;--sea:#2F8F86;--coral:#D97748;--sun:#E3A857;--mute:#7C8B93;
--cardfill:radial-gradient(120% 90% at 100% 0%, rgba(47,143,134,.09) 0%, rgba(47,143,134,0) 55%), linear-gradient(165deg, #FFFDF9 0%, #FAF2E4 100%)}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden;max-width:100vw}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;margin:0;letter-spacing:.01em}
.mono{font-family:'IBM Plex Mono',monospace}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--sea);text-decoration:none}a:hover{color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
.hd{padding:calc(env(safe-area-inset-top, 0px) + 24px) 0 12px;position:relative;overflow:hidden}
.hd::before{content:"";position:absolute;top:-90px;left:50%;width:520px;height:520px;margin-left:-260px;border-radius:999px;pointer-events:none;background:radial-gradient(circle, rgba(47,143,134,.26) 0%, rgba(245,239,227,0) 72%)}
@media(min-width:640px){.hd{padding-top:32px}}
h1{font-size:clamp(2.1rem,5.5vw,3rem);line-height:1}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--sea);margin:5px 0 0}
.script{font-family:Caveat,cursive;font-size:1.5rem;line-height:1;color:var(--sea);margin:0 0 2px}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;position:relative}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.hd-actions{display:flex;gap:10px;flex-shrink:0}
.icon-toggle{width:46px;height:46px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);flex-shrink:0;transition:opacity .15s ease,background-color .15s ease}
.hd-actions{margin-right:56px}
.icon-toggle-fixed{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 31px);right:20px;z-index:50;box-shadow:0 2px 10px rgba(18,58,78,.14)}
@media(hover:hover){.icon-toggle:hover{opacity:.75}}
.icon-toggle[data-active="1"]{background:var(--ink);border-color:var(--ink);color:#FFFDF9}
.icon-toggle[disabled]{cursor:default;opacity:.45}
.card{background:var(--cardfill);border:1px solid var(--line);border-radius:16px;padding:20px;overflow:hidden}
@media(min-width:640px){.card{padding:24px}}
.card.todaycard{display:flex;align-items:center;gap:12px;min-height:92px;padding:16px 18px}
.date-row{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;flex-shrink:0;white-space:nowrap}
.today-divider{align-self:stretch;width:1px;background:var(--line)}
.stats{display:flex;flex:1;justify-content:space-between;gap:4px;min-width:0}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 3px;position:relative;flex:1;min-width:0}
.stat:not(:last-child)::after{content:"";position:absolute;right:0;top:0;bottom:0;width:1px;background:var(--line)}
.stat .stat-val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:1rem;white-space:nowrap}
.stat .stat-lbl{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);line-height:1.2;text-align:center;max-width:100%;overflow-wrap:break-word}
.grid{display:grid;grid-template-columns:1fr;gap:16px;padding-bottom:40px}
.side{display:contents}
.tiles{order:-1}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);align-items:start}.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}.tiles{order:0}}
@media(max-width:520px){.legend div:last-child{margin-left:0;width:100%}}
.tiles{display:grid;grid-template-columns:1fr;gap:12px}
.tile{border-radius:16px;padding:16px 18px;color:#FFFDF9;display:flex;align-items:center;gap:16px;min-height:92px}
.tile-ic{width:50px;height:50px;border-radius:99px;background:rgba(255,253,249,.2);display:grid;place-items:center;flex-shrink:0}
.tile-txt{min-width:0}
.tile .lbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;margin:0}
.tile .val{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.5rem;line-height:1.1;margin:4px 0 2px}
.tile .sub{font-size:12.5px;opacity:.9;margin:0;line-height:1.45}
.calhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.seg{display:flex;background:#F5EFE3;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:500;color:var(--mute);min-height:36px;transition:opacity .15s ease,background-color .15s ease}
.seg button[data-on="1"]{background:var(--ink);color:#FFFDF9}
.nav{display:flex;align-items:center;gap:4px}
.nav button{width:38px;height:38px;border-radius:999px;background:#F5EFE3;border:1px solid var(--line);display:grid;place-items:center;transition:opacity .15s ease}
.nav button:hover{opacity:.7}
.nav .today{width:auto;padding:0 14px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
.dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.dow div{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:5px}
.cell{position:relative;aspect-ratio:1;display:grid;place-items:center;cursor:pointer;user-select:none}
.cell.void{cursor:default}
.band{position:absolute;left:0;right:0;top:3px;bottom:3px}
.num{position:relative;font-size:14px;font-weight:500;z-index:1;font-family:'IBM Plex Mono',monospace}
@media(max-width:420px){.num{font-size:12px}}
.cell.past .num{opacity:.38}
.cell.busy{cursor:not-allowed}
.today-ring{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:5px;height:5px;border-radius:99px;background:var(--ink);z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.legend span.sw{width:16px;height:10px;border-radius:3px;display:inline-block}
.legend div{display:flex;align-items:center;gap:7px}
.yr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.yr{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.yr{grid-template-columns:repeat(4,1fr)}}
.ym{background:#F5EFE3;border:1px solid var(--line);border-radius:12px;padding:10px}
.ym p{margin:0 0 7px;text-align:center;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:12.5px}
.ycal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.yd{aspect-ratio:1;border-radius:2px;background:#FFFDF9}
h2{font-size:1.3rem;margin-bottom:12px}
.field{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#FFFDF9;font-size:15px;outline:none;min-height:46px}
.field:focus{border-color:var(--sea)}
.rangebox{display:flex;align-items:center;gap:10px;background:#F5EFE3;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-size:13.5px;min-height:48px}
.rangebox b{font-family:'IBM Plex Mono',monospace;font-size:13.5px;font-weight:600}
.catrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{padding:11px 10px;border-radius:8px;border:1px solid var(--line);background:#FFFDF9;font-size:13px;font-weight:500;color:var(--mute);min-height:46px;display:flex;align-items:center;justify-content:center;gap:7px;transition:opacity .15s ease,background-color .15s ease}
.cat .dot{width:9px;height:9px;border-radius:99px}
.btn{width:100%;min-height:48px;border-radius:8px;background:var(--ink);color:#FFFDF9;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s ease}
.btn:hover{opacity:.9}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:#F5EFE3;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;background:#F5EFE3;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.row .nm{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .dt{font-size:11.5px;color:var(--mute);font-family:'IBM Plex Mono',monospace}
.iconbtn{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;color:var(--mute);transition:opacity .15s ease}
.iconbtn:hover{opacity:.7;color:var(--ink)}
.note{font-size:12.5px;line-height:1.5;color:var(--mute)}
.err{font-size:13px;color:var(--coral);font-weight:500}
.ok{font-size:13px;color:var(--sea);font-weight:500}
.stack{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#FBEEDC;color:#8A5A17;border-radius:999px;padding:5px 11px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em}
.foot{padding:8px 0 44px;font-size:12px;color:var(--mute);text-align:center;line-height:1.55;max-width:520px;margin:0 auto}
.tide{position:fixed;left:0;right:0;bottom:0;height:140px;overflow:hidden;pointer-events:none;z-index:0}
.tide>div{position:absolute;top:0;bottom:0;left:0;width:200%;display:flex}
.tide svg{width:50%;height:100%;flex:none;display:block}
@keyframes tideDrift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style>
</head>

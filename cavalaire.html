<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Cavalaire</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192-v2.png" />
<link rel="apple-touch-icon" href="icon-192-v2.png" />
<meta name="theme-color" content="#123A4E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photo-sphere-viewer@4/dist/photo-sphere-viewer.min.css" />
<style>
:root{--bg:#F5EFE3;--ink:#123A4E;--teal:#2F8F86;--mute:#7C8B93;--line:#E7DFCF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--teal);text-decoration:none}
a:hover{color:var(--ink)}
.wrap{max-width:480px;margin:0 auto;padding:28px 20px 50px;display:flex;flex-direction:column;align-items:center;gap:14px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:2rem;margin:8px 0 0}
p{margin:0;line-height:1.6;color:var(--mute);text-align:center}
.pano{width:100%;height:340px;border-radius:18px;overflow:hidden;background:#000;border:1.5px solid var(--line);margin-top:6px}
.tag{font-size:.75rem;color:var(--mute);margin-top:-4px}
.back{font-family:'IBM Plex Mono',monospace;font-size:0.8rem;letter-spacing:0.05em;border:1.5px solid var(--line);border-radius:999px;padding:10px 20px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <svg viewBox="0 0 48 48" style="width:96px;height:96px">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#63BDB2"/><stop offset="1" stop-color="#2A6A7E"/></linearGradient>
    </defs>
    <path fill="url(#g)" stroke="url(#g)" stroke-width="2.4" stroke-linejoin="round" d="M24 4 Q28.3 10.7 29 17.1 Q35.3 15.8 43 17.8 Q38 24 32.1 26.6 Q35.3 32.2 35.8 40.2 Q28.3 37.3 24 32.5 Q19.7 37.3 12.2 40.2 Q12.7 32.2 15.9 26.6 Q10 24 5 17.8 Q12.7 15.8 19 17.1 Q19.7 10.7 24 4 Z"/>
    <g fill="#F5EFE3"><circle cx="24" cy="18" r="1.9"/><circle cx="24" cy="14" r="1.5"/><circle cx="24" cy="10.5" r="1.15"/><circle cx="29.7" cy="22.1" r="1.9"/><circle cx="33.5" cy="20.9" r="1.5"/><circle cx="37.3" cy="19.7" r="1.15"/><circle cx="27.5" cy="28.9" r="1.9"/><circle cx="29.9" cy="32.1" r="1.5"/><circle cx="32.2" cy="35.3" r="1.15"/><circle cx="20.5" cy="28.9" r="1.9"/><circle cx="18.1" cy="32.1" r="1.5"/><circle cx="15.8" cy="35.3" r="1.15"/><circle cx="18.3" cy="22.1" r="1.9"/><circle cx="14.5" cy="20.9" r="1.5"/><circle cx="10.7" cy="19.7" r="1.15"/><circle cx="26.1" cy="21.2" r="1"/><circle cx="27.3" cy="25.1" r="1"/><circle cx="24" cy="27.5" r="1"/><circle cx="20.7" cy="25.1" r="1"/><circle cx="21.9" cy="21.2" r="1"/></g>
  </svg>
  <h1>Cavalaire</h1>
  <p>Diese Seite ist noch im Aufbau. Hier entstehen bald Informationen rund um Cavalaire-sur-Mer – Strände, Restaurants, Ausflugstipps und Wissenswertes zur Umgebung.</p>

  <div id="viewer" class="pano"></div>
  <span class="tag">360°-Testbild – wird später durch dein eigenes Strandfoto ersetzt</span>

  <a class="back" href="index.html">← Zur Startseite</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/uevent@2/browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/photo-sphere-viewer@4/dist/photo-sphere-viewer.min.js"></script>
<script>
  new PhotoSphereViewer.Viewer({
    container: document.querySelector('#viewer'),
    panorama: 'https://photo-sphere-viewer-data.netlify.app/assets/sphere.jpg',
    navbar: ['zoom', 'fullscreen'],
    defaultZoomLvl: 0,
  });
</script>
</body>
</html>

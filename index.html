<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Cavalaire</title>
<script>
  if (sessionStorage.getItem("cavalaire_start_seen")) {
    document.documentElement.classList.add("no-anim");
  }
  sessionStorage.setItem("cavalaire_start_seen", "1");
</script>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192-v2.png" />
<link rel="apple-touch-icon" href="icon-192-v2.png" />
<meta name="theme-color" content="#123A4E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cavalaire" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
:root{--bg:#F5EFE3;--ink:#123A4E;--teal:#2F8F86;--gold:#E3A857;--mute:#7C8B93}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.screen{position:relative;width:100%;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top, 0px) + 90px) 20px 40px;box-sizing:border-box;gap:38px}
/* Auf grossen Geraeten mit viel Hoehe die drei Symbole mittig zwischen
   Kopfbereich und Wellen verteilen. Die Bedingung schliesst Telefone aus,
   auch quer gehalten, wo die Hoehe knapp ist. */
/* Flache Bildschirme, vor allem quer gehaltene Telefone: enger setzen,
   damit die drei Symbole moeglichst ohne Scrollen sichtbar bleiben. */
@media (max-height:600px){
  .screen{padding-top:calc(env(safe-area-inset-top, 0px) + 24px);gap:16px}
  .tide{height:120px}
}
@media (min-width:600px) and (min-height:900px){
  .screen{justify-content:center;padding-bottom:230px;gap:56px}
}
.glow{position:absolute;top:26%;left:50%;width:460px;height:460px;margin:-230px 0 0 -230px;border-radius:999px;background:radial-gradient(circle, rgba(47,143,134,0.30) 0%, rgba(245,239,227,0) 72%);animation:glow 1.6s ease-out both;pointer-events:none}

.nav-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav-item:active{opacity:.8}
.nav-item .label{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.6rem;line-height:1;height:28px;display:flex;align-items:center}

.tide{position:absolute;left:0;right:0;bottom:0;height:190px;overflow:hidden;animation:tideRise .5s cubic-bezier(.2,.7,.2,1) .25s both;pointer-events:none}
.tide-row{position:absolute;top:0;bottom:0;left:0;width:200%;display:flex}
.tide-row svg{width:50%;height:100%;flex:none;display:block}

.caption{position:absolute;bottom:calc(env(safe-area-inset-bottom, 0px) + 26px);left:0;right:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:0.75rem;letter-spacing:0.1em;color:var(--mute);animation:fadeUp .8s ease-out 1.9s both}

.weather-stat{position:absolute;left:max(20px, calc(50% - 220px));font-family:'IBM Plex Mono',monospace;font-size:0.75rem;letter-spacing:0.1em;color:var(--mute);opacity:0;animation:fadeUp .8s ease-out 2s both;white-space:nowrap}
.weather-air{top:calc(env(safe-area-inset-top, 0px) + 110px)}
.weather-hum{top:50%;transform:translateY(-50%)}
.weather-sea{bottom:105px}

@keyframes sfIn { 0% { opacity:0; transform:scale(.55) rotate(-28deg); } 60% { opacity:1; } 100% { opacity:1; transform:scale(1) rotate(0deg); } }
@keyframes sfSway { 0% { transform:rotate(0deg) translateY(0); } 25% { transform:rotate(-2.5deg) translateY(-2px); } 50% { transform:rotate(0deg) translateY(-4px); } 75% { transform:rotate(2.5deg) translateY(-2px); } 100% { transform:rotate(0deg) translateY(0); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:.92; } }
@keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
@keyframes tideRise { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
@keyframes dotPulse { 0% { transform:scale(1); } 50% { transform:scale(1.13); } 100% { transform:scale(1); } }
@keyframes glow { from { opacity:0; transform:scale(.7); } to { opacity:1; transform:scale(1); } }
@keyframes tideDrift { from { transform:translateX(0); } to { transform:translateX(-50%); } }

/* Beim Zurück-Navigieren von einer Unterseite: Startanimationen überspringen, sofort fertigen Zustand zeigen */
html.no-anim .glow{animation:none!important;opacity:1!important;transform:scale(1)!important}
html.no-anim .nav-item{animation:none!important;opacity:1!important;transform:translateY(0)!important}
html.no-anim a[href="cavalaire.html"] > div{animation:none!important;opacity:1!important;transform:scale(1) rotate(0deg)!important}
html.no-anim [style*="dotPulse"]{animation:dotPulse 4.5s ease-in-out infinite!important;opacity:.92!important}
html.no-anim .tide{animation:none!important;opacity:1!important;transform:translateY(0)!important}
html.no-anim .caption{animation:none!important;opacity:1!important;transform:translateY(0)!important}
html.no-anim .weather-stat{animation:none!important;opacity:1!important}
</style>
</head>
<body>

    <circle id="spKalGold" cx="27.6" cy="31.4" r="2.8" fill="#E3A857"></circle>
  </defs>
</svg>

<div class="screen">
  <div class="glow"></div>

  <a class="nav-item" href="cavalaire.html" style="animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) .45s both" aria-label="Cavalaire öffnen">
    <div style="animation:sfIn .9s cubic-bezier(.2,.7,.2,1) .45s both">
      <div style="animation:sfSway 5.5s ease-in-out 1.5s infinite">
        <svg viewBox="0 0 48 48" style="width:112px; height:112px; display:block">
          <use href="#spSf"></use>
          <use href="#spSfDots" style="transform-box:fill-box; transform-origin:center; animation:fadeIn .6s ease-out .95s both, dotPulse 4.5s ease-in-out 1.6s infinite"></use>
        </svg>
      </div>
    </div>
    <span class="label">Cavalaire</span>
  </a>

  <a class="nav-item" href="maison.html" style="animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) .85s both" aria-label="Maison öffnen">
    <svg viewBox="0 0 48 48" style="width:84px; height:84px; display:block">
      <use href="#spHs"></use>
      <use href="#spHsDots" style="transform-box:fill-box; transform-origin:center; animation:fadeIn .6s ease-out 1.25s both, dotPulse 4.5s ease-in-out 2s infinite"></use>
    </svg>

  </a>

  <a class="nav-item" href="belegung.html" style="animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) 1.25s both" aria-label="Belegung öffnen">
    <svg viewBox="0 0 48 48" style="width:84px; height:84px; display:block">
      <use href="#spKal"></use>
      <use href="#spKalDots" style="transform-box:fill-box; transform-origin:center; animation:fadeIn .6s ease-out 1.65s both, dotPulse 4.5s ease-in-out 2.4s infinite"></use>
      <use href="#spKalGold"></use>
    </svg>
    <span class="label">Belegung</span>
  </a>

  <div class="tide">
    <div class="tide-row" style="animation:tideDrift 20s linear infinite"><svg viewBox="0 0 400 190" preserveAspectRatio="none"><path d="M0 30c50 0 50 12 100 12s50-12 100-12 50 12 100 12 50-12 100-12 50 12 100 12 50-12 100-12 50 12 100 12V190H0Z" fill="#2F8F86" opacity="0.07"></path></svg><svg viewBox="0 0 400 190" preserveAspectRatio="none"><path d="M0 30c50 0 50 12 100 12s50-12 100-12 50 12 100 12 50-12 100-12 50 12 100 12 50-12 100-12 50 12 100 12V190H0Z" fill="#2F8F86" opacity="0.07"></path></svg></div>

    <div class="tide-row" style="animation:tideDrift 11s linear infinite"><svg viewBox="0 0 400 190" preserveAspectRatio="none"><path d="M0 98c50 0 50 16 100 16s50-16 100-16 50 16 100 16 50-16 100-16 50 16 100 16 50-16 100-16 50 16 100 16V190H0Z" fill="#2F8F86" opacity="0.14"></path></svg><svg viewBox="0 0 400 190" preserveAspectRatio="none"><path d="M0 98c50 0 50 16 100 16s50-16 100-16 50 16 100 16 50-16 100-16 50 16 100 16 50-16 100-16 50 16 100 16V190H0Z" fill="#2F8F86" opacity="0.14"></path></svg></div>
    <div class="tide-row" style="animation:tideDrift 8s linear infinite reverse"><svg viewBox="0 0 400 190" preserveAspectRatio="none"><path d="M0 136c50 0 50 14 100 14s50-14 100-14 50 14 100 14 50-14 100-14 50 14 100 14 50-14 100-14 50 14 100 14V190H0Z" fill="#123A4E" opacity="0.12"></path></svg><svg viewBox="0 0 400 190" preserveAspectRatio="none"><path d="M0 136c50 0 50 14 100 14s50-14 100-14 50 14 100 14 50-14 100-14 50 14 100 14 50-14 100-14 50 14 100 14V190H0Z" fill="#123A4E" opacity="0.12"></path></svg></div>
  </div>

  <div class="weather-stat weather-air" id="wxAir">–° Luft</div>
  <div class="weather-stat weather-hum" id="wxHum">–% Feuchte</div>
  <div class="weather-stat weather-sea" id="wxSea">–° Wasser</div>

<script>
  (async () => {
    try {
      const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=43.1725&longitude=6.5322&current=temperature_2m,relative_humidity_2m&timezone=Europe%2FParis");
      if (!r.ok) throw 0;
      const d = await r.json();
      document.getElementById("wxAir").textContent = Math.round(d.current.temperature_2m) + "° Luft";
      document.getElementById("wxHum").textContent = Math.round(d.current.relative_humidity_2m) + "% Feuchte";
    } catch (e) {}
  })();
  (async () => {
    try {
      const r = await fetch("https://marine-api.open-meteo.com/v1/marine?latitude=43.10&longitude=6.58&current=sea_surface_temperature&cell_selection=sea&timezone=Europe%2FParis");
      if (!r.ok) throw 0;
      const d = await r.json();
      document.getElementById("wxSea").textContent = Math.round(d.current.sea_surface_temperature) + "° Wasser";
    } catch (e) {}
  })();
</script>

:root{--bg:#FFF4E4;--ink:#14313F;--card:#fff;--line:#EADCC6;--sea:#0FA3A3;--coral:#FF6B3D;--sun:#FFC53D;--mute:#7B8B93}

h1,h2,h3{font-family:'Bricolage Grotesque','Public Sans',sans-serif;margin:0;letter-spacing:-.02em}
.mono{font-family:'Space Mono',monospace}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--sea)}a:hover{color:var(--coral)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.hd{padding:calc(env(safe-area-inset-top, 0px) + 44px) 0 20px}
@media(min-width:640px){.hd{padding-top:28px}}
.kicker{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sea)}
h1{font-size:clamp(2.1rem,5.5vw,3.4rem);font-weight:800;line-height:.98;margin:10px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500}
.chip .mono{font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr;gap:16px;padding-bottom:40px}
.side{display:contents}
.tiles{order:-1}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1.55fr) minmax(330px,1fr);align-items:start}.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}.tiles{order:0}}
@media(max-width:520px){.legend div:last-child{margin-left:0;width:100%}}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:18px}
@media(min-width:640px){.card{padding:22px}}
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:430px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border-radius:18px;padding:14px;color:#fff;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.tile .lbl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;opacity:.8}
.tile .val{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.5rem;line-height:1.05;margin-top:6px}
.tile .sub{font-size:11.5px;opacity:.85;margin-top:3px;line-height:1.25}
.calhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--mute);min-height:36px}
.seg button[data-on="1"]{background:var(--ink);color:#fff}
.nav{display:flex;align-items:center;gap:4px}
.nav button{width:40px;height:40px;border-radius:999px;background:var(--bg);display:grid;place-items:center}
.nav button:hover{background:var(--sun)}
.nav .today{width:auto;padding:0 15px;font-size:12.5px;font-weight:700}
.dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.dow div{text-align:center;font-size:11px;letter-spacing:.08em;color:var(--mute);font-family:'Space Mono',monospace}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:5px}
.cell{position:relative;aspect-ratio:1;display:grid;place-items:center;cursor:pointer;user-select:none}
.cell.void{cursor:default}
.band{position:absolute;left:0;right:0;top:3px;bottom:3px}
.num{position:relative;font-size:14px;font-weight:600;z-index:1}
@media(max-width:420px){.num{font-size:12.5px}}
.cell.past .num{opacity:.38}
.cell.busy{cursor:not-allowed}
.today-ring{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:5px;height:5px;border-radius:99px;background:var(--ink);z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;padding-top:14px;border-top:1.5px solid var(--line);font-size:12.5px;color:var(--mute)}
.legend span.sw{width:16px;height:10px;border-radius:4px;display:inline-block}
.legend div{display:flex;align-items:center;gap:7px}
.yr{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.yr{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.yr{grid-template-columns:repeat(4,1fr)}}
.ym{background:var(--bg);border-radius:14px;padding:10px}
.ym p{margin:0 0 7px;text-align:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:12.5px}
.ycal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.yd{aspect-ratio:1;border-radius:3px;background:#fff}
h2{font-size:1.15rem;font-weight:600;margin-bottom:12px}
.field{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:15px;outline:none;min-height:46px}
.field:focus{border-color:var(--sea)}
.rangebox{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:11px 13px;font-size:13.5px;min-height:48px}
.rangebox b{font-family:'Space Mono',monospace;font-size:13.5px}
.catrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{padding:11px 10px;border-radius:14px;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--mute);min-height:46px;display:flex;align-items:center;justify-content:center;gap:7px}
.cat .dot{width:9px;height:9px;border-radius:99px}
.btn{width:100%;min-height:50px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:#0d2531}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:var(--bg);color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:10px 12px}
.row .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .dt{font-size:11.5px;color:var(--mute);font-family:'Space Mono',monospace}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
.iconbtn:hover{background:#fff;color:var(--ink)}
.note{font-size:12.5px;line-height:1.45;color:var(--mute)}
.err{font-size:13px;color:var(--coral);font-weight:600}
.ok{font-size:13px;color:var(--sea);font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#FFF0D6;color:#8A5A17;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600}
.foot{padding:8px 0 44px;font-size:12px;color:var(--mute);text-align:center;line-height:1.5;max-width:520px;margin:0 auto}
.admin-toggle{width:40px;height:40px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--mute)}
.admin-toggle:hover{color:var(--ink)}

@keyframes splashSfIn{0%{opacity:0;transform:scale(.55) rotate(-28deg)}60%{opacity:1}100%{opacity:1;transform:scale(1) rotate(0deg)}}
@keyframes splashSfSway{0%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-4px)}100%{transform:rotate(-2.5deg) translateY(0)}}
@keyframes splashFadeIn{from{opacity:0}to{opacity:.92}}
@keyframes splashFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashLineGrow{from{width:0}to{width:28px}}
@keyframes splashTideRise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes splashTideDrift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes splashGlow{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden;cursor:pointer;transition:opacity .45s ease}
.splash.hide{opacity:0;pointer-events:none}
.splash-glow{position:absolute;top:22%;left:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:999px;background:radial-gradient(circle, rgba(15,163,163,0.16) 0%, rgba(255,244,228,0) 68%);animation:splashGlow 1.4s ease-out both}
.splash-star-in{animation:splashSfIn 1s cubic-bezier(.2,.7,.2,1) both;position:relative;z-index:1}
.splash-star-sway{animation:splashSfSway 5.5s ease-in-out 1.1s infinite}
.splash-title{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-weight:800;font-size:2.4rem;line-height:1;color:var(--ink);position:relative;z-index:1;animation:splashFadeUp .8s cubic-bezier(.2,.7,.2,1) .95s both}
.splash-loc{display:flex;align-items:center;gap:12px;position:relative;z-index:1;animation:splashFadeUp .8s cubic-bezier(.2,.7,.2,1) 1.15s both}
.splash-loc-line{height:1px;width:28px;background:var(--ink);animation:splashLineGrow .6s ease-out 1.3s both}
.splash-loc-text{font-family:'Space Mono',monospace;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sea)}
.splash-tide{position:absolute;left:0;right:0;bottom:0;height:190px;overflow:hidden;animation:splashTideRise .5s cubic-bezier(.2,.7,.2,1) .25s both}
.splash-tide-row{position:absolute;top:0;bottom:0;left:0;width:200%;display:flex}
.splash-tide-row svg{width:50%;height:100%;flex:none;display:block}
.splash-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);left:0;right:0;text-align:center;font-family:'Space Mono',monospace;font-size:.75rem;letter-spacing:.1em;color:var(--mute);animation:splashFadeUp .8s ease-out 1.7s both}
@media(prefers-reduced-motion:reduce){.splash-star-in,.splash-star-sway,.splash-title,.splash-loc,.splash-loc-line,.splash-tide,.splash-hint,.splash-glow{animation:none;opacity:1}}

</style>

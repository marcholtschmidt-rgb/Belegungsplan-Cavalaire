<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Cavalaire</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="theme-color" content="#123A4E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cavalaire" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
:root{--bg:#F5EFE3;--ink:#123A4E;--teal:#2F8F86;--gold:#E3A857;--mute:#7C8B93}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

.screen{position:relative;max-width:480px;margin:0 auto;min-height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:calc(env(safe-area-inset-top, 0px) + 90px) 20px 40px;box-sizing:border-box;gap:38px}
.glow{position:absolute;top:26%;left:50%;width:460px;height:460px;margin:-230px 0 0 -230px;border-radius:999px;background:radial-gradient(circle, rgba(47,143,134,0.30) 0%, rgba(245,239,227,0) 72%);animation:glow 1.6s ease-out both;pointer-events:none}
.map-outline{position:absolute;top:0;left:50%;width:330px;height:330px;opacity:0;animation:mapIn 1.2s ease-out .1s both;pointer-events:none}

.nav-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav-item:active{opacity:.8}
.nav-item .label{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.6rem;line-height:1;height:28px;display:flex;align-items:center}

.tide{position:absolute;left:0;right:0;bottom:0;height:190px;overflow:hidden;animation:tideRise .5s cubic-bezier(.2,.7,.2,1) .25s both;pointer-events:none}
.tide-row{position:absolute;top:0;bottom:0;left:0;width:200%;display:flex}
.tide-row svg{width:50%;height:100%;flex:none;display:block}

.caption{position:absolute;bottom:calc(env(safe-area-inset-bottom, 0px) + 26px);left:0;right:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:0.75rem;letter-spacing:0.1em;color:var(--mute);animation:fadeUp .8s ease-out 1.9s both}

@keyframes sfIn { 0% { opacity:0; transform:scale(.55) rotate(-28deg); } 60% { opacity:1; } 100% { opacity:1; transform:scale(1) rotate(0deg); } }
@keyframes sfSway { 0% { transform:rotate(0deg) translateY(0); } 25% { transform:rotate(-2.5deg) translateY(-2px); } 50% { transform:rotate(0deg) translateY(-4px); } 75% { transform:rotate(2.5deg) translateY(-2px); } 100% { transform:rotate(0deg) translateY(0); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:.92; } }
@keyframes mapIn { from { opacity:0; transform:translate(-50%,-70%) scale(.96); } to { opacity:.14; transform:translate(-50%,-70%) scale(1); } }
@keyframes fadeUp { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
@keyframes tideRise { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
@keyframes dotPulse { 0% { transform:scale(1); } 50% { transform:scale(1.13); } 100% { transform:scale(1); } }
@keyframes glow { from { opacity:0; transform:scale(.7); } to { opacity:1; transform:scale(1); } }
@keyframes tideDrift { from { transform:translateX(0); } to { transform:translateX(-50%); } }
</style>
</head>

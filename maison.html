<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Maison</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192-v2.png" />
<link rel="apple-touch-icon" href="icon-192-v2.png" />
<meta name="theme-color" content="#123A4E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css" />
<style>
:root{--bg:#F5EFE3;--ink:#123A4E;--teal:#2F8F86;--mute:#7C8B93;--line:#E7DFCF}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding:24px}
a{color:var(--teal);text-decoration:none}
a:hover{color:var(--ink)}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:24px}
.card{max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:2rem;margin:0}
p{margin:0;line-height:1.6;color:var(--mute)}
.back{font-family:'IBM Plex Mono',monospace;font-size:0.8rem;letter-spacing:0.05em;border:1.5px solid var(--line);border-radius:999px;padding:10px 20px}
.pano-section{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.pano-section h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.3rem;margin:0;color:var(--ink)}
.pano{width:100%;height:280px;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line)}
.pano-tag{font-family:'IBM Plex Mono',monospace;font-size:0.75rem;color:var(--mute);margin:0}
.icon-toggle{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:20px;width:44px;height:44px;border-radius:999px;background:#FFFDF9;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--ink);z-index:50;box-shadow:0 2px 10px rgba(18,58,78,.14)}
.icon-toggle:hover{background:var(--bg)}
.info-section{width:100%;text-align:left;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.info-section h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.3rem;margin:0;color:var(--ink)}
.wifi-card{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#FFFDF9}
.wifi-icon{width:56px;height:56px;flex:none}
.wifi-rows{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.wifi-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wifi-row:hover{border-color:var(--teal)}
.wifi-text{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.wifi-label{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--mute)}
.wifi-value{font-family:'IBM Plex Mono',monospace;font-size:0.95rem;color:var(--ink);overflow-wrap:anywhere}
.wifi-copy{flex:none;color:var(--mute)}
.wifi-row.copied .wifi-copy{color:var(--teal)}
.wifi-hint{font-size:0.85rem;color:var(--mute);margin:0}
</style>
</head>
<body>
<a href="index.html" class="icon-toggle" aria-label="Startseite" title="Startseite">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>
</a>
<div class="wrap">
<div class="card">
  <svg viewBox="0 0 48 48" style="width:96px;height:96px">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#63BDB2"/><stop offset="1" stop-color="#2A6A7E"/></linearGradient>
    </defs>
    <path fill="url(#g)" stroke="url(#g)" stroke-width="2.4" stroke-linejoin="round" d="M24 4.5 Q25.6 5.6 42.4 21 Q43.6 22.2 42.4 23.4 Q41.4 24.4 39.6 23.8 L39.6 40.6 Q39.6 43.4 36.8 43.4 L11.2 43.4 Q8.4 43.4 8.4 40.6 L8.4 23.8 Q6.6 24.4 5.6 23.4 Q4.4 22.2 5.6 21 Q22.4 5.6 24 4.5 Z"/>
    <g fill="#F5EFE3"><circle cx="24" cy="12" r="2.3"/><circle cx="19.5" cy="16.6" r="1.9"/><circle cx="28.5" cy="16.6" r="1.9"/><circle cx="15" cy="21.2" r="1.5"/><circle cx="33" cy="21.2" r="1.5"/><circle cx="24" cy="29" r="2.8"/><circle cx="17.4" cy="29" r="1.9"/><circle cx="30.6" cy="29" r="1.9"/><circle cx="24" cy="35.6" r="1.9"/><circle cx="17.4" cy="35.6" r="1.5"/><circle cx="30.6" cy="35.6" r="1.5"/></g>
  </svg>
  <h1>Maison</h1>
  <p>Praktische Informationen rund ums Haus. Der Bereich wächst noch – Anleitungen, Kontakte und Hausregeln kommen nach und nach dazu.</p>
</div>

<div class="info-section">
  <h2>Internet</h2>
  <div class="wifi-card">
    <svg class="wifi-icon" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient id="gWifi" x1="0" y1="0" x2="0.7" y2="1"><stop offset="0" stop-color="#63BDB2"/><stop offset="1" stop-color="#2A6A7E"/></linearGradient>
      </defs>
      <g fill="none" stroke="url(#gWifi)" stroke-width="5.6" stroke-linecap="round">
        <path d="M6.2 19.4 Q24 4.4 41.8 19.4"/>
        <path d="M12.4 27.2 Q24 17.4 35.6 27.2"/>
        <path d="M18.8 34.8 Q24 30.4 29.2 34.8"/>
      </g>
      <circle cx="24" cy="40.6" r="3.1" fill="url(#gWifi)"/>
      <g fill="#F5EFE3" opacity="0.92"><circle cx="24" cy="10.6" r="1.5"/><circle cx="13.4" cy="16.4" r="1.2"/><circle cx="34.6" cy="16.4" r="1.2"/><circle cx="24" cy="20.8" r="1.4"/><circle cx="17.4" cy="24.4" r="1.1"/><circle cx="30.6" cy="24.4" r="1.1"/><circle cx="24" cy="31.4" r="1.2"/></g>
    </svg>
    <div class="wifi-rows">
      <button type="button" class="wifi-row" data-copy="PLATZHALTER-NETZWERK">
        <span class="wifi-text">
          <span class="wifi-label">Netzwerk</span>
          <span class="wifi-value">PLATZHALTER-NETZWERK</span>
        </span>
        <svg class="wifi-copy" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
      <button type="button" class="wifi-row" data-copy="PLATZHALTER-PASSWORT">
        <span class="wifi-text">
          <span class="wifi-label">Passwort</span>
          <span class="wifi-value">PLATZHALTER-PASSWORT</span>
        </span>
        <svg class="wifi-copy" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
    </div>
  </div>
  <p class="wifi-hint">Zum Kopieren antippen.</p>
</div>

<div class="pano-section">
  <h2>360°-Eindrücke</h2>
  <p style="color:var(--mute); font-size:0.94rem; line-height:1.6">Der Rundblick von der Terrasse – zum Umschauen ziehen.</p>
  <div id="viewer" class="pano"></div>
  <p class="pano-tag">Blick von der Terrasse</p>
</div>

<a class="back" href="index.html">← Zur Startseite</a>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
    "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.module.js",
    "@photo-sphere-viewer/equirectangular-tiles-adapter": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/equirectangular-tiles-adapter/index.module.js"
  }
}
</script>
<script type="module">
  import { Viewer } from '@photo-sphere-viewer/core';
  import { EquirectangularTilesAdapter } from '@photo-sphere-viewer/equirectangular-tiles-adapter';

  const psvViewer = new Viewer({
    container: document.querySelector('#viewer'),
    adapter: EquirectangularTilesAdapter,
    panorama: {
      width: 7680,
      cols: 8,
      rows: 4,
      baseUrl: 'assets/terrasse-360-low.jpg',
      tileUrl: (col, row) => `assets/tiles/terrasse_${col}_${row}.jpg`,
    },
    navbar: ['zoom', 'fullscreen'],
    defaultZoomLvl: 0,
  });
  ['fullscreenchange', 'webkitfullscreenchange'].forEach((evt) => {
    document.addEventListener(evt, () => {
      setTimeout(() => {
        psvViewer.autoSize();
      }, 150);
    });
  });
</script>
<script>
  document.querySelectorAll('.wifi-row').forEach((row) => {
    row.addEventListener('click', async () => {
      const value = row.dataset.copy;
      try {
        await navigator.clipboard.writeText(value);
      } catch {
        const tmp = document.createElement('textarea');
        tmp.value = value;
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand('copy');
        tmp.remove();
      }
      const label = row.querySelector('.wifi-label');
      const original = label.textContent;
      label.textContent = 'kopiert';
      row.classList.add('copied');
      setTimeout(() => {
        label.textContent = original;
        row.classList.remove('copied');
      }, 1400);
    });
  });
</script>
</body>
</html>
